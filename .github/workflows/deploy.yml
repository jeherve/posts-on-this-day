# This workflow automatically updates the plugin on WordPress.org
name: Deploy to WordPress.org
on:
  # Only trigger when a release is published (and not a pre-release) in the GitHub repo.
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # build/ is not committed, so the block editor script is built here and handed to the
  # deploy job as an artifact. npm packages run in this job, which has no access to the
  # WordPress.org credentials.
  build:
    name: Build block editor script
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: npm

    - name: Build
      run: |
        npm ci
        npm run build

    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: block-editor-build
        path: build/
        if-no-files-found: error
        retention-days: 1

  tag:
    name: Deploy new tag to WordPress.org
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.3
        tools: composer
        extensions: mysql, imagick
        coverage: none

    - name: Install dependencies
      run: |
        composer install --no-dev

    - name: Download build
      uses: actions/download-artifact@v8
      with:
        name: block-editor-build
        path: build/

    - name: WordPress Plugin Deploy
      uses: 10up/action-wordpress-plugin-deploy@stable
      env:
        SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
